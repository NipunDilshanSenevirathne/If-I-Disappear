name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API, engine and evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - name: Install
        run: pip install -r services/api/requirements-dev.txt
      - name: Lint
        run: |
          cd services/api && ruff check app tests && ruff format --check app tests && cd ../..
          ruff check --select E,F,I,B,UP --ignore E501,B008,B904,UP042 --line-length 140 evals
      - name: Tests (no network, no model)
        working-directory: services/api
        env:
          AI_MODE: fixture
        run: python -m pytest
      - name: Evaluation report (no model calls)
        env:
          AI_MODE: fixture
        run: python -m evals.run --no-tests
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation-report
          path: evals/reports/

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: Typecheck and build
        working-directory: apps/web
        run: npm run build

  container:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build the Cloud Run image
        run: docker build -t if-i-disappear:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name iid -p 8080:8080 -e SESSION_SECRET=ci-only if-i-disappear:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          curl -fsS localhost:8080/ | grep -q "If I Disappear"
          TOKEN=$(curl -fsS -X POST localhost:8080/api/session | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])")
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' localhost:8080/api/demo > /dev/null
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Browser end-to-end test (every main flow, in Chromium)
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs http://localhost:8080 ../../.smoke
      - name: Accessibility check (axe-core, every screen, light and dark)
        working-directory: apps/web
        run: node scripts/a11y.mjs http://localhost:8080
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-screenshots
          path: .smoke/
      - name: Container logs
        if: always()
        run: docker logs iid | tail -40
