defaults: {review: accepted, created_by: fixture}
claims:
  # loan
  - {id: J-C01, predicate: DOES, subject: selvam, object: r_loan, evidence: [{source_id: J01, quote: "I pay the motorbike loan on the 15th at the finance company branch in town."}]}
  - {id: J-C02, predicate: SCHEDULE, subject: r_loan, schedule: {freq: monthly, monthday: 15}, evidence: [{source_id: J01, quote: "I pay the motorbike loan on the 15th"}, {source_id: J05, quote: "Due: 15th of each month"}]}
  - {id: J-C03, predicate: ROUTE, subject: r_loan, object: rt_loan, evidence: [{source_id: J01, quote: "at the finance company branch in town"}]}
  - {id: J-C04, predicate: ROUTE_NEEDS, subject: rt_loan, object: loan_card, evidence: [{source_id: J05, quote: "Bring this card when you pay at the branch."}]}
