# Reviewed claims for the Perera household (the "gold" knowledge base).
# Every quote is copied exactly from its source; the verifier checks this and
# fills in the locator. `model_inference` claims say what was inferred in `note`.
# In live mode Gemini proposes claims like these and the household reviews them.

defaults:
  review: accepted
  created_by: fixture

