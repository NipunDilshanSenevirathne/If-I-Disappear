# What the household captured before the assessment (25 Oct 2026).
# Voice notes are scripted transcripts; record them for real for the demo video.
# Documents are rendered as SAMPLE images by `python -m app.tools.render_samples`.

sources:
  - id: S01
    kind: voice
    title: A normal month
    language: en
    speaker: nirmala
    observed: 2026-10-20
    redactions: 1
    text: >-
      Okay, a normal month. The electricity bill comes on paper and I pay it by the 10th on the
      Lanka Savings app. The app sends a code to my number every time. My app password is
      [secret removed]. If the app isn't working, I pay cash at the post office. You just take
      the bill. Sunil could do that too, but I haven't asked him. I'm not keeping this number.
      I'll buy a Japanese SIM at the airport and this one will stop. The school van fee is six
      thousand rupees. I give it to Mr Silva on the 5th, when he picks up the children at half
      past six. If I miss him, I call him and he comes by in the evening. His number is only in
      my phone. And the school sends everything to my number, so I see all the school messages.

  - id: S02
    kind: voice
    title: Achchi's clinic
    language: en
    speaker: nirmala
    observed: 2026-10-20
    text: >-
      Achchi's clinic is every second Thursday at the district hospital. The next one is on the
      12th of November. I always take her. We leave at seven to get a number and we're usually
      back by half past eleven. You have to take her clinic book and her medicine list. They're
      in the top drawer of the steel cupboard. Only I know where they are. The next date is
      always written in the clinic book. The clinic also sends an SMS reminder to my phone. The
      most important thing is to take the book and the list, otherwise they can't give the
      tablets.

  - id: S03
    kind: voice
    title: Sunil's week
    language: en
    speaker: sunil
    observed: 2026-10-21
    text: >-
      Thursdays are my airport days. I leave for Katunayake at half past three in the morning
      and I'm back around ten. On the 24th of December I have a Kataragama pilgrimage hire,
      booked and paid, so I can't cancel that one. I'll take Amma to the clinic, no problem, but
      Thursdays are my airport days. I can give Mr Silva the van money if Nirmala leaves it
      ready. The gas I always do myself. The gas shop number is in my phone. The insurance I
      have never done. Nirmala does all that. Without valid insurance I can't take hires. The
      police check it.

