  - id: S13
    kind: voice
    title: What matters most
    language: en
    speaker: nirmala
    observed: 2026-10-24
    text: >-
      What matters most is Achchi's clinic and keeping Sunil's hires going, that's our income.
      The insurance too, of course. The bills and the school things matter, but they're not
      life and death. The gas is easy, Sunil does it.
